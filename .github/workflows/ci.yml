name: CI

on:
  push:
    branches: [main]
  pull_request:
    # type-scoping collects the #174 phase PRs before they merge to main
    branches: [main, type-scoping]

permissions:
  contents: read

jobs:
  # Full self-hosting build + bootstrap-sync gate + native test suite.
  # Runs on Linux and macOS; the sync check is platform-independent so it
  # only needs to run once (on Linux).
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is retired. Pinned rather than macos-latest so the OS
        # doesn't move under us.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync

      - name: Two-stage self-host build
        run: make selfhost

      - name: Verify bootstrap C is in sync with SLOP source
        if: matrix.os == 'ubuntu-latest'
        run: make check-sync

      - name: Run native test suite
        run: make test-native

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The release tarball, and an install of it, as release.yml builds them:
      # `slop`, its native tools and stdlib, and `slop mcp` must all work from
      # the package alone (smoke_dist.py unsets SLOP_HOME)
      - name: Smoke-test the release package
        run: |
          ./scripts/package.sh ci tar.gz > /dev/null
          python scripts/smoke_dist.py dist/slop-dev-ci/bin/slop examples/fibonacci.slop
          PREFIX="$RUNNER_TEMP/slop-prefix" dist/slop-dev-ci/install.sh > /dev/null
          python scripts/smoke_dist.py "$RUNNER_TEMP/slop-prefix/bin/slop" examples/fibonacci.slop
