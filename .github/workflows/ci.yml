name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Full self-hosting build + bootstrap-sync gate + native test suite.
  # Runs on Linux and macOS; the sync check is platform-independent so it
  # only needs to run once (on Linux).
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync

      - name: Two-stage self-host build
        run: make selfhost

      - name: Verify bootstrap C is in sync with SLOP source
        if: matrix.os == 'ubuntu-latest'
        run: make check-sync

      - name: Run native test suite
        run: make test-native
