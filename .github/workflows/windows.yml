name: Windows

# SLOP on Windows: the toolchain built from the bootstrap C, then programs
# built, run and tested through the CLI, with MinGW-w64 gcc and with LLVM
# clang targeting MSVC. The clang leg also compiles the std modules' C with
# clang-cl, as cc-rs does for a Rust -sys crate that vendors it.
#
# Unlike ci.yml, this runs on pull requests whatever their base, so every
# layer of a stacked PR gets it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MINGW64 is msvcrt-based, like Rust's x86_64-pc-windows-gnu
          - toolchain: mingw-gcc
            cc: gcc
            packages: mingw-w64-x86_64-gcc make
          # The runner's LLVM, which finds Visual Studio's headers and libs
          - toolchain: clang-msvc
            cc: clang
            packages: make
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Keep the runner's PATH, for uv and LLVM's clang and clang-cl
          path-type: inherit
          install: ${{ matrix.packages }}

      - name: Build the toolchain from bootstrap
        run: |
          make -C bootstrap CC="$CC"
          mkdir -p bin
          for t in bootstrap/bin/slop-*; do
            case "$t" in
              *.exe) cp "$t" bin/ ;;
              *) cp "$t" "bin/$(basename "$t").exe" ;;
            esac
          done
          for t in bin/slop-*.exe; do "$t" --version; done

      - name: Set up the CLI
        run: uv sync

      - name: Run the Windows test suite
        run: ./scripts/run_windows_tests.sh ${{ matrix.toolchain == 'clang-msvc' && '--clang-cl' || '' }}

      # The release zip, and an install of it, as release.yml builds them from
      # MinGW binaries: slop.cmd, its native tools and stdlib, and `slop mcp`
      # must all work from the package alone (smoke_dist.py unsets SLOP_HOME)
      - uses: actions/setup-python@v5
        if: matrix.toolchain == 'mingw-gcc'
        with:
          python-version: '3.12'

      - name: Smoke-test the release package
        if: matrix.toolchain == 'mingw-gcc'
        shell: pwsh
        run: |
          ./scripts/package.ps1 | Out-Null
          $dist = "dist\slop-dev-windows-x64"
          python scripts\smoke_dist.py "$dist\bin\slop.cmd" "$dist\examples\fibonacci.slop"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SLOP_PREFIX = "$env:RUNNER_TEMP\slop"
          & "$dist\install.ps1" | Out-Null
          python scripts\smoke_dist.py "$env:SLOP_PREFIX\bin\slop.cmd" "$dist\examples\fibonacci.slop"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
