# Native SLOP Test Harness Generator
# Build with: uv run slop build (from this directory)

# No [project] name: the toolchain's modules keep unqualified C names
# (<module>_<name>). A name here would qualify them (#360).
[project]
version = "0.1.0"
entry = "main.slop"

[build]
output = "slop-tester"
include = ["../common", "../parser", "../transpiler", "../../std", "../../std/strlib", "../../std/io", "../../std/os"]
type = "executable"
